output:
  root: D:\FoundNO_test_runs

seed:
  value: 42
  deterministic: false

inspections:
  enabled: true

tasks:
  - name: pdebench_2d_reacdiff_window
    source:
      location: url
      format: hdf5_grouped
      variable_path: data
      url: https://darus.uni-stuttgart.de/api/access/datafile/133017
      path: D:/PDEBench_data/2D_ReacDiff/2D_diff-react_NA_NA.h5
      axis_selection:
        0:
          linspace: [0, 50, 16]

    adapter:
      type: temporal
      variable_name: null
      data_order: TXYC
      temporal_mode: window
      input_time_indices: [0, 1, 2, 3]
      output_time_indices: [4, 5, 6, 7]
      window_start_indices: [0, 4, 8]
      flatten_time_to_channels: false
      benchmark_name: PDEBench
      physics_name: 2d_reacdiff

    trajectory_selection:
      count: 20
      strategy: first
      seed: 42

    split:
      type: ratios
      train: 0.8
      val: 0.1
      test: 0.1

    loaders:
      train:
        batch_size: 4
        num_workers: 0
        pin_memory: false
        shuffle: true
        drop_last: false
      val:
        batch_size: 2
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false
      test:
        batch_size: 2
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false

  - name: pdebench_swe
    source:
      location: url
      format: hdf5_grouped
      variable_path: data
      url: https://darus.uni-stuttgart.de/api/access/datafile/133021
      path: D:/PDEBench_data/SWE/2D_rdb_NA_NA.h5
      axis_selection:
        0:
          linspace: [ 0, 50, 16 ]
    adapter:
      type: temporal
      variable_name: null
      data_order: TXYC
      temporal_mode: initial_to_trajectory
      input_time_index: 0
      output_time_indices: all
      flatten_time_to_channels: false
      benchmark_name: PDEBench
      physics_name: swe
    trajectory_selection:
      count: 50
      strategy: random
      seed: 42
    split:
      type: ratios
      train: 0.8
      val: 0.1
      test: 0.1
    loaders:
      train:
        batch_size: 4
        num_workers: 0
        pin_memory: false
        shuffle: true
        drop_last: false
      val:
        batch_size: 4
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false
      test:
        batch_size: 4
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false

  - name: poseidon_ce_window
    source:
      location: huggingface
      format: concat_netcdf
      variable_name: data
      sample_dim: sample
      token_env: HF_TOKEN
      axis_selection:
        0:
          linspace: [0, 20, 16]
        2:
          slice: [0, 128, 2]
        3:
          slice: [0, 128, 2]
      files:
        - repo_id: camlab-ethz/CE-RP
          cache_dir: D:/Poseidon_data/CE-RP/hf_cache
          filename: data_0.nc
        - repo_id: camlab-ethz/CE-RP
          cache_dir: D:/Poseidon_data/CE-RP/hf_cache
          filename: data_1.nc
        - repo_id: camlab-ethz/CE-KH
          cache_dir: D:/Poseidon_data/CE-KH/hf_cache
          filename: data_0.nc
        - repo_id: camlab-ethz/CE-KH
          cache_dir: D:/Poseidon_data/CE-KH/hf_cache
          filename: data_1.nc
        - repo_id: camlab-ethz/CE-CRP
          cache_dir: D:/Poseidon_data/CE-CRP/hf_cache
          filename: data_0.nc
        - repo_id: camlab-ethz/CE-CRP
          cache_dir: D:/Poseidon_data/CE-CRP/hf_cache
          filename: data_1.nc
        - repo_id: camlab-ethz/CE-Gauss
          cache_dir: D:/Poseidon_data/CE-Gauss/hf_cache
          filename: data_0.nc
        - repo_id: camlab-ethz/CE-Gauss
          cache_dir: D:/Poseidon_data/CE-Gauss/hf_cache
          filename: data_1.nc

    adapter:
      type: temporal
      variable_name: null
      data_order: TCHW
      temporal_mode: window
      input_time_indices: [0, 1, 2, 3]
      output_time_indices: [4, 5, 6, 7]
      window_start_indices: [0, 4, 8]
      flatten_time_to_channels: false
      benchmark_name: Poseidon
      physics_name: ce
      input_channel_indices: [0, 1, 2, 3, 4]
      output_channel_indices: [0, 1, 2, 3, 4]

    trajectory_selection:
      count: 40
      strategy: first
      seed: 42

    split:
      type: ratios
      train: 0.8
      val: 0.1
      test: 0.1

    loaders:
      train:
        batch_size: 4
        num_workers: 0
        pin_memory: false
        shuffle: true
        drop_last: false
      val:
        batch_size: 4
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false
      test:
        batch_size: 4
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: false

normalization:
  enabled: true
  normalize_x: true
  normalize_y: true
  device: cuda
  max_fit_batches: 2

model:
  type: adapted_fno
  n_dim: 3
  hidden_channels: 2
  lifting_layers: 1
  projection_layers: 1
  core_layers: 2
  n_modes: [2, 2, 2]

training:
  epochs: 1
  device: cuda
  train_main_fno: true
  gradient_accumulation_steps: 2
  optimizer:
    optimizer: adamw
    lr: 0.001
    weight_decay: 1.0e-05
  scheduler:
    scheduler: reducelr
    patience: 2
    factor: 0.5
    min_lr: 1.0e-06

evaluation:
  after_training: false

metrics:
  names:
    - mse
    - mae
    - rmse
    - nrmse
    - vrmse
    - relative_l2
    - balanced_relative_l2
    - nmae_range
    - r2_score
    - mean_linf_error
    - max_linf_error
  physical:
    - name: spectral_mse
      tasks: all
    - name: spectral_nrmse
      tasks: all
    - name: band_spectral_mse_2d
      tasks: all
    - name: band_spectral_nrmse_2d
      tasks: all
